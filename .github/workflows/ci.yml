name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint + tests)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements-dev.txt

      - name: Ruff check
        run: ruff check python

      - name: Ruff format (check)
        run: ruff format --check python

      - name: Compile Python sources
        run: python -m compileall -q python/main.py python/gui.py python/build.py

      - name: Pytest
        run: pytest --cov=main --cov-report=term-missing:skip-covered --cov-fail-under=35

  cpp:
    name: C++ (configure + build)
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build cpp/build --config Release --parallel

      - name: Smoke — --status
        run: |
          $exe = @(
            "cpp/build/bin/NetworkMonitorCpp.exe",
            "cpp/build/bin/Release/NetworkMonitorCpp.exe",
            "cpp/build/Release/NetworkMonitorCpp.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path cpp/build -Recurse -Filter NetworkMonitorCpp.exe |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { throw "NetworkMonitorCpp.exe não encontrado após o build" }
          Write-Host "Executando: $exe --status"
          & $exe --status

  validate:
    name: Validate repo layout
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required files exist
        run: |
          $required = @(
            "python/main.py",
            "python/gui.py",
            "python/requirements.txt",
            "python/requirements-dev.txt",
            "cpp/CMakeLists.txt",
            "cpp/src/main.cpp",
            "pyproject.toml",
            "README.md"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) {
              throw "Arquivo obrigatório ausente: $path"
            }
          }
          Write-Host "Layout OK"

      - name: Gitignored runtime files not committed
        run: |
          foreach ($name in @("peers.json", "state.json", "monitor.log")) {
            $tracked = git ls-files -- $name
            if ($tracked) {
              throw "$name não deve estar versionado (está no .gitignore)"
            }
          }
          Write-Host "Runtime files não versionados — OK"
